# Logging
logger:
  level: DEBUG

# API pour Home Assistant
api:
  encryption:
    key: "votre_clé_ici"

# OTA pour mises à jour sans fil
ota:
  password: "votre_mot_de_passe"

# WiFi
wifi:
  ssid: "Votre_SSID"
  password: "Votre_Password"
  
  # Fallback hotspot
  ap:
    ssid: "Trill Fallback"
    password: "12345678"
